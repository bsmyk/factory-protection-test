# .factory/factory.conf: committed with the repo, reviewed like code.
# Detected stack: unknown

# Agent loops started by `factory up`. Use name or name:copies.
# Definitions come from the kit's agents/ or from .factory/agents/<name>.md in this repo.
agents = director planner builder:2 intent reviewer lead verifier
# The intent reviewer checks each change fits the spec and direction before the code review.
# To drop it, remove `intent` above and the next line.
on_success_builder = intent

# Runs once in every new worktree (each task gets its own), e.g. to install dependencies.
setup = 

# Gates must all pass before a builder's work is committed, again after it merges into the
# integration branch, and again before a milestone goes to a person. Fast gates (lint, types:
# seconds) run first and agents run them often while working; the first failure stops the run.
# fast_gate = <lint or type check>
# gate = <add your test command here>

# Starts the app so the verifier can check each milestone end to end in a browser, the way a
# person would. The driver picks a free port and passes it as $PORT. Leave empty for libraries/CLIs.
# run = npm run dev -- --port $PORT
run =
run_url = http://localhost:$PORT
run_timeout_sec = 120
browser = playwright      # browser tools for agents with `browser: yes` (the verifier); `none` turns them off

# Commands agents may run, inserted wherever an agent lists $STACK in its tools.
# stack_tool = Bash(make *)

base_branch = main
integration_branch = factory/integration

# A person approves each milestone's plan (its specs) before anything is built.
approve_specs = yes
# Spending cap per milestone in US dollars, from session costs. 0 = no limit.
# Change one milestone's with `factory budget M<n> <usd>`.
milestone_budget_usd = 0

# Reviewed tasks merge on their own unless they're risky; risky ones wait for `factory approve T-…`.
# human_review: high (risky tasks wait) | all (every task waits) | none (never wait)
human_review = high
large_change_lines = 400
# risky_paths = (^|/)(migrations?|auth|security|payments?|billing)(/|\.|_)|^\.github/workflows/|(^|/)Dockerfile|(^|/)(infra|terraform|k8s|helm)/

# Models per agent override the kit defaults (opus to plan and review, sonnet to build):
# model_builder = opus

# Run agents' shell commands in Claude Code's OS sandbox (macOS Seatbelt, Linux bubblewrap).
sandbox = no

# Files the driver treats as tests: deleting them or adding skip/only markers fails a builder's attempt.
# test_pattern = (^|/)(tests?|__tests__|specs?)/|\.(test|spec)\.[^/]+$|(^|/)test_[^/]*\.py$|_test\.(py|go)$

max_attempts = 3          # builder sessions per claim before the task goes to the lead
max_rework = 3            # review rejections before the task goes to the lead
max_decide = 2            # lead attempts per item before it goes to a person
max_calls = 40            # Claude sessions per worker per `factory up`
session_timeout_min = 30  # default; agents can set timeout_min
poll_seconds = 15
idle_exit_polls = 4       # loops exit after this many polls with nothing to do
gates_after_merge = yes

# --- real-run test settings
gate = python3 -m unittest discover -s tests -t . -q
stack_tool = Bash(python3 *)
run = python3 app.py
sandbox = yes
milestone_budget_usd = 8
agents = director planner builder intent reviewer lead verifier
model_director = sonnet
model_planner = sonnet
model_intent = sonnet
model_reviewer = sonnet
model_lead = sonnet
model_verifier = sonnet
session_timeout_min = 20
poll_seconds = 5
idle_exit_polls = 3
